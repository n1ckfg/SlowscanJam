<!DOCTYPE html>
<html>
<head>
    <title>SlowscanJam - Encoder/Decoder Pipeline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: monospace; overflow: hidden; }
        #container { display: flex; flex-direction: row; align-items: flex-start; gap: 10px; height: 100vh; padding: 10px; }
        .column { display: flex; flex-direction: column; gap: 10px; }
        .panel { margin-bottom: 0; }
        .label { color: #ff6b00; margin-bottom: 5px; font-size: 12px; }
        canvas { border: 1px solid #333; width: 640px; height: 360px; image-rendering: pixelated; max-width: 100%; }
        #source { border-color: #0f0; }
        #encoded { border-color: #0ff; }
        #decoded { border-color: #f00; }
        #controls { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #ff6b00; max-width: 280px; z-index: 100; }
        #controls h3 { color: #ff6b00; margin-bottom: 10px; font-size: 14px; }
        .control-row { margin-bottom: 8px; }
        .control-row label { display: block; font-size: 12px; margin-bottom: 3px; }
        .control-row input[type="range"] { width: 100%; }
        .control-row input[type="checkbox"] { width: auto; margin-right: 8px; }
        #status { position: fixed; bottom: 10px; left: 10px; color: #0f0; font-size: 12px; z-index: 100; }
        #startBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 18px; background: #ff6b00; color: #000; border: none; cursor: pointer; z-index: 200; }
        #startBtn:hover { background: #ff8c00; }
    </style>
</head>
<body>
    <button id="startBtn">Click to Start Camera</button>

    <div id="container">
        <div class="column">
            <div class="panel">
                <div class="label">SOURCE (Camera Input)</div>
                <canvas id="source" width="320" height="150"></canvas>
            </div>
            <div class="panel">
                <div class="label">DECODED (Output Display)</div>
                <canvas id="decoded" width="640" height="360"></canvas>
            </div>
        </div>
        <div class="column">
            <div class="panel">
                <div class="label">ENCODED (Audio Signal Preview)</div>
                <canvas id="encoded" width="320" height="150"></canvas>
            </div>
        </div>
    </div>

    <div id="controls">
        <h3>Encoder/Decoder Controls</h3>
        <div class="control-row">
            <label>Lines: <span id="linesVal">200</span></label>
            <input type="range" id="lines" min="50" max="200" step="10" value="200">
        </div>
        <div class="control-row">
            <label>FPS: <span id="fpsVal">6</span></label>
            <input type="range" id="fps" min="1" max="6" step="0.5" value="6">
        </div>
        <div class="control-row">
            <label>Line Width: <span id="lineWidthVal">5</span></label>
            <input type="range" id="lineWidth" min="0.5" max="5" step="0.5" value="5">
        </div>
        <div class="control-row">
            <label>Brightness: <span id="brightnessVal">1.0</span></label>
            <input type="range" id="brightness" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div class="control-row">
            <label>Saturation: <span id="saturationVal">1.0</span></label>
            <input type="range" id="saturation" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div class="control-row">
            <label><input type="checkbox" id="blend"> Blend Mode</label>
        </div>
        <div class="control-row">
            <label><input type="checkbox" id="showAudio"> Show Audio Waveform</label>
        </div>
    </div>

    <div id="status">Waiting to start...</div>

    <script>
    // ============================================
    // SLOWSCAN ENCODER - Converts video frames to stereo audio
    // Preallocates typed-array scratch buffers so encodeFrame does zero
    // heap allocations and writes via indexed assignment instead of push/spread.
    // ============================================
    class SlowscanEncoder {
        constructor(config = {}) {
            this.sampleRate = config.sampleRate || 96000;
            this.fps = config.fps || 3.0;
            this.lines = config.lines || 150;
            this.pulseLength = config.pulseLength || 0.2 / 1000;
            this.oversample = config.oversample || 10;

            this.hTime = (1 / this.fps / this.lines) * 2;
            this.widthSamples = (this.hTime - (this.pulseLength * 4)) * this.sampleRate;
            this.widthPixels = Math.round(this.widthSamples * this.oversample);
            this.pulseLengthSamples = Math.round(this.pulseLength * this.sampleRate * this.oversample);

            this.field = 0;

            // Precompute polyphase lowpass filter (same shape as original resamplePoly).
            const factor = this.oversample;
            const taps = factor * 4 + 1;
            this.filterTaps = taps;
            this.filterHalf = (taps - 1) / 2;
            this.filter = new Float32Array(taps);
            let fsum = 0;
            for (let i = 0; i < taps; i++) {
                const n = i - this.filterHalf;
                let v = n === 0 ? 1.0 : Math.sin(Math.PI * n / factor) / (Math.PI * n);
                v *= 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (taps - 1));
                this.filter[i] = v;
                fsum += v;
            }
            for (let i = 0; i < taps; i++) this.filter[i] /= fsum;

            const P = this.pulseLengthSamples;
            const W = this.widthPixels;
            const halfLines = Math.floor(this.lines / 2);
            // Field sync = 3P (2P pulses + P quiet). Every line = W + P quiet.
            // Lines 1..halfLines-1 get a 3P sync prefix before the line data.
            this.oversampledSize = 3 * P + halfLines * (W + P) + (halfLines - 1) * 3 * P;

            // Oversampled scratch is only needed by the CPU path; allocated on first use.
            this.leftOS = null;
            this.rightOS = null;

            this.outSize = Math.ceil(this.oversampledSize / factor);
            this.outLeft = new Float32Array(this.outSize);
            this.outRight = new Float32Array(this.outSize);

            this.gpu = null;
            if (config.gpu) {
                try {
                    config.gpu.configure(this);
                    this.gpu = config.gpu;
                } catch (e) {
                    console.warn('[SlowscanJam] GPU encoder unavailable, using CPU:', e.message);
                }
            }
        }

        // Encode the current contents of a canvas, resolving to { left, right }
        // (or null if a GPU result was superseded). With a WebGLEncoder attached
        // the whole encode runs in shaders; otherwise pixels are read back and
        // encoded on the CPU.
        async encodeCanvas(canvas, ctx) {
            if (this.gpu) {
                const pending = this.gpu.encode(canvas, this);
                this.field = 1 - this.field;
                return pending;
            }
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            return this.encodeFrame(data, canvas.width, canvas.height);
        }

        encodeFrame(frameData, width, height) {
            if (!this.leftOS) {
                this.leftOS = new Float32Array(this.oversampledSize);
                this.rightOS = new Float32Array(this.oversampledSize);
            }
            const P = this.pulseLengthSamples;
            const W = this.widthPixels;
            const halfLines = Math.floor(this.lines / 2);
            const srcHeight = Math.min(height, this.lines);
            const srcWidth = Math.min(width, W);

            const L = this.leftOS, R = this.rightOS;
            let idx = 0;

            // Field sync
            if (this.field === 0) {
                for (let i = 0; i < P; i++) { L[idx] = -1; R[idx] = 1; idx++; }
                for (let i = 0; i < P; i++) { L[idx] = 1; R[idx] = -1; idx++; }
            } else {
                for (let i = 0; i < P; i++) { L[idx] = 1; R[idx] = -1; idx++; }
                for (let i = 0; i < P; i++) { L[idx] = -1; R[idx] = 1; idx++; }
            }
            for (let i = 0; i < P; i++) { L[idx] = 0; R[idx] = 0; idx++; }

            for (let ln = 0; ln < halfLines; ln++) {
                if (ln !== 0) {
                    if ((ln & 1) === 0) {
                        for (let i = 0; i < P; i++) { L[idx] = 1; R[idx] = 1; idx++; }
                        for (let i = 0; i < P; i++) { L[idx] = -1; R[idx] = -1; idx++; }
                    } else {
                        for (let i = 0; i < P; i++) { L[idx] = -1; R[idx] = -1; idx++; }
                        for (let i = 0; i < P; i++) { L[idx] = 1; R[idx] = 1; idx++; }
                    }
                    for (let i = 0; i < P; i++) { L[idx] = 0; R[idx] = 0; idx++; }
                }

                const row = ln * 2 + this.field;
                const srcRow = Math.floor((row / this.lines) * (srcHeight - 1));
                const rowBase = srcRow * srcWidth * 4;
                const useCb = (ln & 1) === 0;

                for (let x = 0; x < W; x++) {
                    const srcX = ((x * (srcWidth - 1)) / W) | 0;
                    const sIdx = rowBase + srcX * 4;
                    const r = frameData[sIdx];
                    const g = frameData[sIdx + 1];
                    const b = frameData[sIdx + 2];
                    const y = 0.299 * r + 0.587 * g + 0.114 * b;
                    const c = useCb
                        ? (-0.168736 * r - 0.331264 * g + 0.5 * b + 128)
                        : (0.5 * r - 0.418688 * g - 0.081312 * b + 128);
                    L[idx] = y * (1 / 255) - 0.5;
                    R[idx] = c * (1 / 255) - 0.5;
                    idx++;
                }
                for (let i = 0; i < P; i++) { L[idx] = 0; R[idx] = 0; idx++; }
            }

            // idx === oversampledSize at this point; downsample.
            this.resampleInto(L, idx, this.outLeft);
            this.resampleInto(R, idx, this.outRight);

            this.field = 1 - this.field;
            const outLen = Math.ceil(idx / this.oversample);
            return {
                left: this.outLeft.subarray(0, outLen),
                right: this.outRight.subarray(0, outLen)
            };
        }

        resampleInto(src, srcLen, out) {
            const factor = this.oversample;
            const taps = this.filterTaps;
            const filter = this.filter;
            const halfTaps = this.filterHalf;
            const outLen = Math.ceil(srcLen / factor);

            for (let i = 0; i < outLen; i++) {
                let val = 0;
                const center = i * factor;
                const base = center - halfTaps;
                const hi = base + taps;
                if (base >= 0 && hi <= srcLen) {
                    // Fast path: no edge mirroring needed.
                    for (let j = 0; j < taps; j++) val += src[base + j] * filter[j];
                } else {
                    for (let j = 0; j < taps; j++) {
                        let sIdx = base + j;
                        if (sIdx < 0) sIdx = Math.min(-sIdx, srcLen - 1);
                        else if (sIdx >= srcLen) sIdx = Math.max(0, 2 * srcLen - 2 - sIdx);
                        val += src[sIdx] * filter[j];
                    }
                }
                out[i] = val;
            }
        }
    }

    // ============================================
    // WEBGL ENCODER (GLSL) - SlowscanEncoder.encodeFrame on the GPU
    // Two fragment passes replace getImageData + the CPU colour conversion +
    // the polyphase filter:
    //   1. signal: one fragment per oversampled sample (sync pulse, quiet,
    //      or picture pixel -> YCbCr).
    //   2. filter: one fragment per output sample, the lowpass + decimation
    //      over the signal texture.
    // Both targets are RG32UI holding floatBitsToUint(left, right), so values
    // stay full float32 and the readback is reinterpreted as a Float32Array.
    // The readback goes through a pixel buffer + fence, so the main thread is
    // free while the GPU works. One instance is shared across encoders since
    // browsers cap live WebGL contexts.
    // ============================================
    const GPU_ENCODER_WIDTH = 1024;      // texels per row of both targets
    const GPU_ENCODER_WIDTH_SHIFT = 10;

    class WebGLEncoder {
        constructor() {
            this.canvas = document.createElement('canvas');
            const gl = this.canvas.getContext('webgl2', { antialias: false, depth: false, stencil: false, premultipliedAlpha: false });
            if (!gl) throw new Error('WebGL2 context unavailable');
            this.gl = gl;

            this.vs = `#version 300 es
                 layout(location = 0) in vec2 a_pos;
                 void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

            this.signalProg = glProgram(gl, this.vs,
                `#version 300 es
                 precision highp float;
                 precision highp int;
                 uniform highp sampler2D u_src;
                 uniform ivec2 u_srcSize;   // source size, clamped as in encodeFrame
                 uniform int u_P;           // sync pulse length (oversampled samples)
                 uniform int u_W;           // picture samples per line (oversampled)
                 uniform int u_lines;
                 uniform int u_field;
                 uniform int u_osLen;       // oversampled signal length
                 out uvec2 o_sig;

                 // Every half-field line is a block of 3P sync + W picture + P quiet.
                 // Line 0's sync slot carries the field sync instead of a line sync.
                 vec2 signalAt(int k) {
                     int ln = k / (u_W + 4 * u_P);
                     int pos = k - ln * (u_W + 4 * u_P);
                     if (pos < 3 * u_P) {
                         if (pos >= 2 * u_P) return vec2(0.0);
                         float a = pos < u_P ? 1.0 : -1.0;
                         if (ln == 0) {
                             float l = u_field == 0 ? -a : a;
                             return vec2(l, -l);
                         }
                         return vec2((ln & 1) == 0 ? a : -a);
                     }
                     int x = pos - 3 * u_P;
                     if (x >= u_W) return vec2(0.0);
                     int srcRow = (ln * 2 + u_field) * (u_srcSize.y - 1) / u_lines;
                     int srcX = x * (u_srcSize.x - 1) / u_W;
                     // Snap to exact bytes: some GPUs (e.g. Pi 4 V3D) return
                     // 8-bit texels at fp16 precision.
                     vec3 c = floor(texelFetch(u_src, ivec2(srcX, srcRow), 0).rgb * 255.0 + 0.5);
                     float y = dot(c, vec3(0.299, 0.587, 0.114));
                     float ch = (ln & 1) == 0
                         ? dot(c, vec3(-0.168736, -0.331264, 0.5))
                         : dot(c, vec3(0.5, -0.418688, -0.081312));
                     return vec2(y, ch + 128.0) * (1.0 / 255.0) - 0.5;
                 }

                 void main() {
                     ivec2 fc = ivec2(gl_FragCoord.xy);
                     int k = (fc.y << ${GPU_ENCODER_WIDTH_SHIFT}) + fc.x;
                     o_sig = k < u_osLen ? floatBitsToUint(signalAt(k)) : uvec2(0u);
                 }`
            );
            const loc = (n) => gl.getUniformLocation(this.signalProg, n);
            this.sigLoc = {
                src: loc('u_src'), srcSize: loc('u_srcSize'), P: loc('u_P'), W: loc('u_W'),
                lines: loc('u_lines'), field: loc('u_field'), osLen: loc('u_osLen')
            };
            this.filterProg = null;   // built per tap count by _buildFilter
            this.taps = 0;

            // Full-viewport triangle at attribute location 0.
            this.vao = gl.createVertexArray();
            gl.bindVertexArray(this.vao);
            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
            gl.bindVertexArray(null);

            const nearest = (tex) => {
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                return tex;
            };
            this.srcTex = nearest(gl.createTexture());
            this.sigTex = nearest(gl.createTexture());
            // Raw canvas bytes, same as getImageData.
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
            gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);

            this.sigFBO = gl.createFramebuffer();
            this.outFBO = gl.createFramebuffer();
            this.outRB = gl.createRenderbuffer();
            this.pbo = gl.createBuffer();
            this.sigRows = 0;
            this.outRows = 0;
            this.readback = null;
            this.readbackF = null;
            this.ticket = 0;
            this.configuredFor = null;
        }

        // The taps are unrolled with constant indices. A loop over u_filter ran
        // at half speed on the Pi 4 (V3D), which fetches dynamically indexed
        // uniforms from memory through the texture unit.
        _buildFilter(taps) {
            const gl = this.gl;
            let body = '';
            for (let j = 0; j < taps; j++) body += `acc += tap(base + ${j}) * u_filter[${j}];\n`;
            const prog = glProgram(gl, this.vs,
                `#version 300 es
                 precision highp float;
                 precision highp int;
                 uniform highp usampler2D u_sig;
                 uniform int u_osLen;
                 uniform int u_outLen;
                 uniform int u_factor;      // oversample factor
                 uniform float u_filter[${taps}];
                 out uvec2 o_out;

                 vec2 tap(int k) {
                     // Mirror at the edges, as resampleInto does.
                     if (k < 0) k = min(-k, u_osLen - 1);
                     else if (k >= u_osLen) k = max(0, 2 * u_osLen - 2 - k);
                     ivec2 t = ivec2(k & ${GPU_ENCODER_WIDTH - 1}, k >> ${GPU_ENCODER_WIDTH_SHIFT});
                     return uintBitsToFloat(texelFetch(u_sig, t, 0).xy);
                 }

                 void main() {
                     ivec2 fc = ivec2(gl_FragCoord.xy);
                     int i = (fc.y << ${GPU_ENCODER_WIDTH_SHIFT}) + fc.x;
                     if (i >= u_outLen) { o_out = uvec2(0u); return; }
                     int base = i * u_factor - ${(taps - 1) >> 1};
                     vec2 acc = vec2(0.0);
                     ${body}
                     o_out = floatBitsToUint(acc);
                 }`
            );
            if (this.filterProg) gl.deleteProgram(this.filterProg);
            this.filterProg = prog;
            const loc = (n) => gl.getUniformLocation(prog, n);
            this.filtLoc = {
                sig: loc('u_sig'), osLen: loc('u_osLen'), outLen: loc('u_outLen'),
                factor: loc('u_factor'), filter: loc('u_filter')
            };
            this.taps = taps;
        }

        configure(enc) {
            const gl = this.gl;
            const sigRows = Math.ceil(enc.oversampledSize / GPU_ENCODER_WIDTH);
            const outRows = Math.ceil(enc.outSize / GPU_ENCODER_WIDTH);
            if (sigRows > gl.getParameter(gl.MAX_TEXTURE_SIZE)) throw new Error('signal too long for GPU encoder');
            if (enc.filterTaps !== this.taps) this._buildFilter(enc.filterTaps);

            if (sigRows !== this.sigRows) {
                gl.bindTexture(gl.TEXTURE_2D, this.sigTex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32UI, GPU_ENCODER_WIDTH, sigRows, 0, gl.RG_INTEGER, gl.UNSIGNED_INT, null);
                gl.bindFramebuffer(gl.FRAMEBUFFER, this.sigFBO);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.sigTex, 0);
                this.sigRows = 0;
                if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('signal framebuffer incomplete');
                this.sigRows = sigRows;
            }
            if (outRows !== this.outRows) {
                gl.bindRenderbuffer(gl.RENDERBUFFER, this.outRB);
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32UI, GPU_ENCODER_WIDTH, outRows);
                gl.bindFramebuffer(gl.FRAMEBUFFER, this.outFBO);
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, this.outRB);
                this.outRows = 0;
                if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('output framebuffer incomplete');
                this.outRows = outRows;
                // readPixels on integer targets returns RGBA_INTEGER: 4 words per sample.
                this.readback = new Uint32Array(GPU_ENCODER_WIDTH * outRows * 4);
                this.readbackF = new Float32Array(this.readback.buffer);
            }

            const S = this.sigLoc;
            gl.useProgram(this.signalProg);
            gl.uniform1i(S.src, 0);
            gl.uniform1i(S.P, enc.pulseLengthSamples);
            gl.uniform1i(S.W, enc.widthPixels);
            gl.uniform1i(S.lines, enc.lines);
            gl.uniform1i(S.osLen, enc.oversampledSize);

            const F = this.filtLoc;
            gl.useProgram(this.filterProg);
            gl.uniform1i(F.sig, 1);
            gl.uniform1i(F.osLen, enc.oversampledSize);
            gl.uniform1i(F.outLen, enc.outSize);
            gl.uniform1i(F.factor, enc.oversample);
            gl.uniform1fv(F.filter, enc.filter);
            this.configuredFor = enc;
        }

        // Resolves with { left, right } once the GPU has finished, or null if
        // the result was superseded (reconfigured, or a newer encode submitted).
        async encode(source, enc) {
            const gl = this.gl;
            if (this.configuredFor !== enc) this.configure(enc);
            gl.bindVertexArray(this.vao);

            // Pass 1: oversampled signal.
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, source);
            gl.useProgram(this.signalProg);
            gl.uniform2i(this.sigLoc.srcSize, Math.min(source.width, enc.widthPixels), Math.min(source.height, enc.lines));
            gl.uniform1i(this.sigLoc.field, enc.field);
            gl.bindFramebuffer(gl.FRAMEBUFFER, this.sigFBO);
            gl.viewport(0, 0, GPU_ENCODER_WIDTH, this.sigRows);
            gl.drawArrays(gl.TRIANGLES, 0, 3);

            // Pass 2: lowpass + decimate, read back into the pixel buffer.
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, this.sigTex);
            gl.useProgram(this.filterProg);
            gl.bindFramebuffer(gl.FRAMEBUFFER, this.outFBO);
            gl.viewport(0, 0, GPU_ENCODER_WIDTH, this.outRows);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.bindVertexArray(null);
            gl.bindBuffer(gl.PIXEL_PACK_BUFFER, this.pbo);
            // Fresh storage each frame; reusing it makes Chrome discard the
            // shadow copy it keeps for fenced readbacks.
            gl.bufferData(gl.PIXEL_PACK_BUFFER, this.readback.byteLength, gl.STREAM_READ);
            gl.readPixels(0, 0, GPU_ENCODER_WIDTH, this.outRows, gl.RGBA_INTEGER, gl.UNSIGNED_INT, 0);
            gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.flush();
            const ticket = ++this.ticket;

            const ok = await this._signaled(sync);
            gl.deleteSync(sync);
            if (!ok || ticket !== this.ticket || this.configuredFor !== enc) return null;

            gl.bindBuffer(gl.PIXEL_PACK_BUFFER, this.pbo);
            gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, this.readback);
            gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
            const n = enc.outSize;
            const f = this.readbackF;
            const outL = enc.outLeft, outR = enc.outRight;
            for (let i = 0, o = 0; i < n; i++, o += 4) {
                outL[i] = f[o];
                outR[i] = f[o + 1];
            }
            return { left: outL.subarray(0, n), right: outR.subarray(0, n) };
        }

        // Fence status only updates between tasks, so poll on a timer.
        _signaled(sync) {
            const gl = this.gl;
            return new Promise(resolve => {
                const poll = () => {
                    const r = gl.clientWaitSync(sync, 0, 0);
                    if (r === gl.TIMEOUT_EXPIRED) setTimeout(poll, 1);
                    else resolve(r !== gl.WAIT_FAILED);
                };
                poll();
            });
        }
    }

    function glShader(gl, type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            const log = gl.getShaderInfoLog(s);
            gl.deleteShader(s);
            throw new Error('shader: ' + log);
        }
        return s;
    }

    function glProgram(gl, vs, fs) {
        const p = gl.createProgram();
        const v = glShader(gl, gl.VERTEX_SHADER, vs);
        const f = glShader(gl, gl.FRAGMENT_SHADER, fs);
        gl.attachShader(p, v);
        gl.attachShader(p, f);
        gl.linkProgram(p);
        gl.deleteShader(v);
        gl.deleteShader(f);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
            throw new Error('link: ' + gl.getProgramInfoLog(p));
        }
        return p;
    }

    // ============================================
    // SLOWSCAN DECODER - Converts stereo audio back to video
    // Sample loop is sequential by nature (feedback AGC + sync tracking),
    // so it stays on CPU. All per-sample allocations have been eliminated:
    // chromaDelay, noise, and per-line sample arrays are preallocated.
    // Lines store AGC-normalized YCbCr; RGB conversion, brightness and
    // saturation are applied by the renderer (in a shader with WebGL).
    // ============================================
    const DECODER_MAX_COLORS_PER_LINE = 1024;
    const DECODER_LINE_POOL_MAX = 1024;

    class SlowscanDecoder {
        constructor(config = {}) {
            const defaults = {
                bufferSize: 512,
                clearInterval: 50,
                overScan: 0.82,
                hOffset: 0.06525,
                pulseLength: 0.2 / 1000,
                lineWidth: 2.5,
                brightness: 1,
                saturation: 1,
                blend: true,
                hFreq: 225.0,
                vFreq: 3
            };
            const cfg = { ...defaults, ...config };
            this.bufferSize = cfg.bufferSize;
            this.sig = { LMin: 0.0, LMax: 1.0, CMin: -1.0, CMax: 1.0 };
            this.hPhase = 0;
            this.vPhase = 0;

            this.pulse = { time: 0, timeout: 0, luma: 0, lumaPrev: 0, chroma: 0, chromaPrev: 0, changed: false, ready: false };
            this.timing = { time: 0, lastV: 0, lastH: 0 };
            this.field = 0;
            this.chromaField = 0;
            this.chromaDelayIndex = 0;
            this.lines = [];
            this.linePool = [];
            this.lastClear = 0;
            this.clearInterval = cfg.clearInterval;
            this.overScan = cfg.overScan;
            this.hOffset = cfg.hOffset;
            this.pulseLength = cfg.pulseLength;

            this.canvas = config.canvas;
            this.width = this.canvas.width;
            this.height = this.canvas.height;
            this.lineWidth = cfg.lineWidth;
            this.blend = cfg.blend;
            this.brightness = cfg.brightness;
            this.saturation = cfg.saturation;

            this.audioCtx = config.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            // Rate of the signal being decoded. Live input runs at the audio
            // context's rate; the in-app pipeline passes the encoder's rate.
            this.sampleRate = config.sampleRate || this.audioCtx.sampleRate;
            this.hFreqTarget = 1.0 / cfg.hFreq * this.sampleRate;
            this.vFreqTarget = 1.0 / cfg.vFreq * this.sampleRate;
            this.hFreq = this.hFreqTarget;
            this.vFreq = this.vFreqTarget;

            // Preallocated chroma delay line (one scanline worth of samples).
            this.chromaDelayMax = Math.ceil(this.sampleRate / 10.0) + 16;
            this.chromaDelay = new Float32Array(this.chromaDelayMax);

            // Cheap pseudo-noise LUT reused across samples. Math.random() in the
            // hot loop was a measurable cost; decorrelated indices avoid giving
            // L and C identical jitter.
            this.noiseLUTSize = 4096;
            this.noiseLUT = new Float32Array(this.noiseLUTSize);
            for (let i = 0; i < this.noiseLUTSize; i++) {
                this.noiseLUT[i] = Math.random() * 0.01 - 0.005;
            }
            this.noiseIdxL = 0;
            this.noiseIdxC = this.noiseLUTSize >> 1;

            this.currLine = this.acquireLine();

            this.renderer = null;
            try {
                this.renderer = new WebGLPhosphor(this.canvas);
            } catch (e) {
                console.warn('[SlowscanJam] WebGL2 unavailable, using 2D fallback:', e.message);
                this.renderer = new Canvas2DPhosphor(this.canvas);
            }

            this.requestID = null;
            this.draw = this.draw.bind(this);
            this.draw();
        }

        activate() { this.audioCtx.resume(); }

        acquireLine() {
            const l = this.linePool.pop();
            if (l) { l.count = 0; return l; }
            return {
                x1: 0, y: 0, x2: 0, maxPhase: 0, count: 0,
                phase: new Float32Array(DECODER_MAX_COLORS_PER_LINE),
                ycc: new Float32Array(DECODER_MAX_COLORS_PER_LINE * 3)
            };
        }

        releaseLine(l) {
            if (this.linePool.length < DECODER_LINE_POOL_MAX) {
                this.linePool.push(l);
            }
        }

        hPhaseToX(hPhase) {
            return ((hPhase - this.hOffset) / this.overScan) * this.width;
        }
        vPhaseToY(vPhase, field) {
            return (vPhase + (field / this.vFreq) * this.hFreq * 0.5) * this.height;
        }

        process(lSamples, cSamples) {
            const sampleRate = this.sampleRate;
            const sRateInv = 1.0 / sampleRate;
            const s = this.sig;
            const p = this.pulse;
            const nLUT = this.noiseLUT;
            const nMask = this.noiseLUTSize - 1;
            const chromaDelay = this.chromaDelay;
            const chromaDelayCap = (sampleRate / 10.0) | 0;
            const invOverScan = 1.0 / this.overScan;
            const widthPx = this.width;
            const halfPulse = this.pulseLength * 0.5;

            const n = lSamples.length;
            for (let i = 0; i < n; i++) {
                this.timing.time += 1;

                const lSample = lSamples[i] + nLUT[(this.noiseIdxL = (this.noiseIdxL + 1) & nMask)];
                const cSample = cSamples[i] + nLUT[(this.noiseIdxC = (this.noiseIdxC + 1) & nMask)];

                if (lSample < s.LMin) s.LMin = lSample;
                if (lSample > s.LMax) s.LMax = lSample;
                s.LMin *= 1.0 - sRateInv;
                s.LMax *= 1.0 - sRateInv;
                if (s.LMin > -0.025) s.LMin = -0.025;
                if (s.LMax < 0.025) s.LMax = 0.025;

                if (cSample < s.CMin) s.CMin = cSample;
                if (cSample > s.CMax) s.CMax = cSample;
                s.CMin *= 1.0 - sRateInv;
                s.CMax *= 1.0 - sRateInv;
                if (s.CMin > -0.05) s.CMin = -0.05;
                if (s.CMax < 0.05) s.CMax = 0.05;

                // Normalized levels (0..1 for picture content). Brightness,
                // saturation and YCbCr->RGB are applied at draw time.
                const luma = (lSample * 2.0 - s.LMin) / (s.LMax - s.LMin);
                const chroma = (cSample * 2.0 - s.CMin) / (s.CMax - s.CMin);
                const chromaLast = chromaDelay[this.chromaDelayIndex];

                if (this.chromaDelayIndex < chromaDelayCap) {
                    chromaDelay[this.chromaDelayIndex] = chroma;
                    this.chromaDelayIndex++;
                }

                const cl = this.currLine;
                if (cl.count < DECODER_MAX_COLORS_PER_LINE) {
                    const n2 = cl.count;
                    cl.phase[n2] = this.hPhase;
                    const o = n2 * 3;
                    cl.ycc[o] = luma;
                    if (this.chromaField === 0) { cl.ycc[o + 1] = chromaLast; cl.ycc[o + 2] = chroma; }
                    else { cl.ycc[o + 1] = chroma; cl.ycc[o + 2] = chromaLast; }
                    cl.count = n2 + 1;
                }
                cl.maxPhase = this.hPhase;

                this.hPhase += 1.0 / this.hFreq;
                this.vPhase += 1.0 / this.vFreq;
                cl.x2 = (this.hPhase - this.hOffset) * invOverScan * widthPx;

                let blank = false;

                if ((s.LMax - s.LMin) > 0.1 && (s.CMax - s.CMin) > 0.1) {
                    p.luma = lSample < s.LMin * 0.5 ? -1 : (lSample > s.LMax * 0.5 ? 1 : 0);
                    p.chroma = cSample < s.CMin * 0.5 ? -1 : (cSample > s.CMax * 0.5 ? 1 : 0);

                    if (p.luma !== p.lumaPrev || p.chroma !== p.chromaPrev) {
                        p.time = 0;
                        p.lumaPrev = p.luma;
                        p.chromaPrev = p.chroma;
                        p.changed = true;
                    }

                    if (p.luma !== 0 && p.chroma !== 0) {
                        p.time += sRateInv;
                        if (p.time > halfPulse && p.changed) {
                            p.changed = false;
                            if (!p.ready) {
                                p.ready = true;
                                p.timeout = this.pulseLength * 1.25;
                            } else {
                                p.ready = false;
                                blank = true;
                                const dH = this.timing.time - this.timing.lastH;
                                if (dH < this.hFreqTarget * 1.5 && dH > this.hFreqTarget * 0.5) {
                                    this.hFreq = this.hFreq * 0.9 + dH * 0.1;
                                }
                                this.timing.lastH = this.timing.time;
                                this.hPhase = 0;
                                this.chromaDelayIndex = 0;
                                this.chromaField = p.luma > 0 ? 0 : 1;
                                if (p.luma !== p.chroma) {
                                    const dV = this.timing.time - this.timing.lastV;
                                    if (dV < this.vFreqTarget * 1.5 && dV > this.vFreqTarget * 0.5) {
                                        this.vFreq = this.vFreq * 0.75 + dV * 0.25;
                                    }
                                    this.timing.lastV = this.timing.time;
                                    this.vPhase = 0;
                                    this.chromaField = 1;
                                    this.field = p.luma > 0 ? 0 : 1;
                                }
                            }
                        }
                    }
                }

                this.hFreq = this.hFreq * (1.0 - sRateInv) + this.hFreqTarget * sRateInv;
                this.vFreq = this.vFreq * (1.0 - sRateInv) + this.vFreqTarget * sRateInv;

                if (this.hPhase >= 1.0) {
                    blank = true;
                    this.hPhase -= 1.0;
                    this.chromaDelayIndex = 0;
                    this.chromaField = this.chromaField === 1 ? 0 : 1;
                }
                if (this.vPhase >= 1.0) {
                    blank = true;
                    this.vPhase -= 1.0;
                    this.field = this.field === 0 ? 1 : 0;
                }

                if (blank) {
                    if (this.lines.length < 1024 && cl.count > 5 && cl.maxPhase > 0) {
                        this.lines.push(cl);
                    } else {
                        this.releaseLine(cl);
                    }
                    const nl = this.acquireLine();
                    nl.x1 = (this.hPhase - this.hOffset) * invOverScan * widthPx;
                    nl.y = (this.vPhase + (this.field / this.vFreq) * this.hFreq * 0.5) * this.height;
                    nl.x2 = 0;
                    nl.maxPhase = 0;
                    this.currLine = nl;
                }
            }
        }

        draw() {
            this.requestID = requestAnimationFrame(this.draw);

            if (Date.now() - this.lastClear > this.clearInterval) {
                this.renderer.fade(0.05);
                this.lastClear = Date.now();
            }

            this.renderer.drawLines(this.lines, this.lineWidth, this.blend, this.brightness, this.saturation);

            for (let i = 0; i < this.lines.length; i++) this.releaseLine(this.lines[i]);
            this.lines.length = 0;
        }

        stop() {
            if (this.requestID) cancelAnimationFrame(this.requestID);
        }

        // Stop drawing and free renderer GPU resources. The canvas keeps its
        // context, so the next decoder's renderer reuses it.
        destroy() {
            this.stop();
            this.renderer.dispose();
        }
    }

    // ============================================
    // WEBGL PHOSPHOR RENDERER (WebGL2)
    // Each batch of scanlines is uploaded as one float texture, one row per
    // line holding its normalized (Y, Cb, Cr) samples, and drawn with a single
    // instanced call: one triangle strip per line, two vertices per sample.
    // The vertex shader pulls its sample from the texture by vertex index and
    // converts YCbCr->RGB with brightness/saturation, so the conversion runs
    // once per sample and the rasterizer interpolates colour along the line.
    // The CPU builds no vertices. Blend mode uses additive (ONE, ONE) to
    // approximate the original 'screen' glow.
    // ============================================
    class WebGLPhosphor {
        constructor(canvas) {
            this.canvas = canvas;
            const gl = canvas.getContext('webgl2', { alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: true });
            if (!gl) throw new Error('WebGL2 context unavailable');
            this.gl = gl;

            this.lineProg = glProgram(gl,
                `#version 300 es
                 precision highp float;
                 in float a_vertex;   // 2 per sample: even = top edge, odd = bottom
                 in vec4 a_line;      // per line: x start, x end, y, texture row
                 in float a_last;     // per line: index of last sample
                 uniform highp sampler2D u_ycc;
                 uniform vec2 u_res;
                 uniform float u_halfWidth;
                 uniform float u_brightness;
                 uniform float u_saturation;
                 out vec3 v_col;

                 vec3 toRGB(vec3 ycc) {
                     float y = ycc.x * u_brightness * 255.0;
                     float cb = ycc.y * u_saturation * 255.0 - 128.0;
                     float cr = ycc.z * u_saturation * 255.0 - 128.0;
                     vec3 rgb = vec3(y + 45.0 * cr / 32.0,
                                     y - (11.0 * cb + 23.0 * cr) / 32.0,
                                     y + 113.0 * cb / 64.0);
                     return clamp(rgb, 0.0, 255.0) * (1.0 / 255.0);
                 }

                 void main() {
                     int v = int(a_vertex);
                     int last = int(a_last);
                     // Lines shorter than the batch's longest collapse their spare
                     // vertices onto the last sample (zero-area triangles).
                     int i = min(v >> 1, last);
                     float side = float(v & 1) * 2.0 - 1.0;
                     vec2 pos = vec2(mix(a_line.x, a_line.y, float(i) / float(last)),
                                     a_line.z + side * u_halfWidth);
                     vec2 clip = (pos / u_res) * 2.0 - 1.0;
                     gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
                     v_col = toRGB(texelFetch(u_ycc, ivec2(i, int(a_line.w)), 0).xyz);
                 }`,
                `#version 300 es
                 precision mediump float;
                 in vec3 v_col;
                 out vec4 o_col;
                 void main() { o_col = vec4(v_col, 1.0); }`
            );
            const lp = this.lineProg;
            this.lineLoc = {
                vertex: gl.getAttribLocation(lp, 'a_vertex'),
                line: gl.getAttribLocation(lp, 'a_line'),
                last: gl.getAttribLocation(lp, 'a_last'),
                res: gl.getUniformLocation(lp, 'u_res'),
                halfWidth: gl.getUniformLocation(lp, 'u_halfWidth'),
                ycc: gl.getUniformLocation(lp, 'u_ycc'),
                brightness: gl.getUniformLocation(lp, 'u_brightness'),
                saturation: gl.getUniformLocation(lp, 'u_saturation')
            };

            this.fadeProg = glProgram(gl,
                `#version 300 es
                 in vec2 a_pos;
                 void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`,
                `#version 300 es
                 precision mediump float;
                 uniform vec4 u_color;
                 out vec4 o_col;
                 void main() { o_col = u_color; }`
            );
            this.fadeLoc = {
                pos: gl.getAttribLocation(this.fadeProg, 'a_pos'),
                color: gl.getUniformLocation(this.fadeProg, 'u_color')
            };

            this.fadeBuf = gl.createBuffer();
            this.fadeVAO = gl.createVertexArray();
            gl.bindVertexArray(this.fadeVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, this.fadeBuf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            gl.enableVertexAttribArray(this.fadeLoc.pos);
            gl.vertexAttribPointer(this.fadeLoc.pos, 2, gl.FLOAT, false, 0, 0);

            // Vertex index 0..2*max-1, shared by every line. Instances carry
            // 5 floats: x start, x end, y, texture row, last sample index.
            const vertexIds = new Float32Array(DECODER_MAX_COLORS_PER_LINE * 2);
            for (let i = 0; i < vertexIds.length; i++) vertexIds[i] = i;
            this.vertexBuf = gl.createBuffer();
            this.instanceBuf = gl.createBuffer();
            this.lineVAO = gl.createVertexArray();
            gl.bindVertexArray(this.lineVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuf);
            gl.bufferData(gl.ARRAY_BUFFER, vertexIds, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(this.lineLoc.vertex);
            gl.vertexAttribPointer(this.lineLoc.vertex, 1, gl.FLOAT, false, 0, 0);
            gl.bindBuffer(gl.ARRAY_BUFFER, this.instanceBuf);
            gl.enableVertexAttribArray(this.lineLoc.line);
            gl.vertexAttribPointer(this.lineLoc.line, 4, gl.FLOAT, false, 20, 0);
            gl.vertexAttribDivisor(this.lineLoc.line, 1);
            gl.enableVertexAttribArray(this.lineLoc.last);
            gl.vertexAttribPointer(this.lineLoc.last, 1, gl.FLOAT, false, 20, 16);
            gl.vertexAttribDivisor(this.lineLoc.last, 1);
            gl.bindVertexArray(null);
            this.instanceData = new Float32Array(1024 * 5);

            // RGB32F sample texture, grown on demand (power-of-two dimensions).
            this.yccTex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, this.yccTex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            this.texW = 0;
            this.texH = 0;
            this.texData = new Float32Array(256 * 128 * 3);

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.disable(gl.DEPTH_TEST);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
        }

        fade(alpha) {
            const gl = this.gl;
            gl.useProgram(this.fadeProg);
            gl.bindVertexArray(this.fadeVAO);
            gl.uniform4f(this.fadeLoc.color, 0, 0, 0, alpha);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            gl.bindVertexArray(null);
        }

        drawLines(lines, lineWidth, blend, brightness, saturation) {
            const gl = this.gl;
            let n = 0, maxCount = 0;
            for (let li = 0; li < lines.length; li++) {
                const line = lines[li];
                if (line.count < 2 || line.maxPhase <= 0) continue;
                n++;
                if (line.count > maxCount) maxCount = line.count;
            }
            if (n === 0) return;

            if (maxCount > this.texW || n > this.texH) {
                this.texW = Math.max(this.texW, 1 << Math.ceil(Math.log2(maxCount)));
                this.texH = Math.max(this.texH, 1 << Math.ceil(Math.log2(n)));
                gl.bindTexture(gl.TEXTURE_2D, this.yccTex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB32F, this.texW, this.texH, 0, gl.RGB, gl.FLOAT, null);
            }
            // Staging rows are packed at maxCount samples so only that much uploads.
            const rowStride = maxCount * 3;
            if (rowStride * n > this.texData.length) this.texData = new Float32Array(this.texW * this.texH * 3);
            if (n * 5 > this.instanceData.length) this.instanceData = new Float32Array(this.texH * 5);
            const tex = this.texData;
            const inst = this.instanceData;

            let row = 0;
            for (let li = 0; li < lines.length; li++) {
                const line = lines[li];
                const count = line.count;
                if (count < 2 || line.maxPhase <= 0) continue;

                tex.set(line.ycc.subarray(0, count * 3), row * rowStride);

                // Phase advances linearly along a line, so samples are spaced
                // evenly between the first and last sample's x.
                const dxdp = (line.x2 - line.x1) / line.maxPhase;
                const jx = Math.random() * 2 - 1;
                const jy = Math.random() * 2 - 1;
                const o = row * 5;
                inst[o] = line.x1 + dxdp * line.phase[0] + jx;
                inst[o + 1] = line.x1 + dxdp * line.phase[count - 1] + jx;
                inst[o + 2] = line.y + jy;
                inst[o + 3] = row;
                inst[o + 4] = count - 1;
                row++;
            }

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.yccTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
            gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, maxCount, n, gl.RGB, gl.FLOAT, tex);

            gl.bindBuffer(gl.ARRAY_BUFFER, this.instanceBuf);
            gl.bufferData(gl.ARRAY_BUFFER, inst, gl.DYNAMIC_DRAW, 0, n * 5);

            gl.useProgram(this.lineProg);
            const L = this.lineLoc;
            gl.uniform2f(L.res, this.canvas.width, this.canvas.height);
            gl.uniform1f(L.halfWidth, lineWidth * 0.5);
            gl.uniform1i(L.ycc, 0);
            gl.uniform1f(L.brightness, brightness);
            gl.uniform1f(L.saturation, saturation);

            gl.enable(gl.BLEND);
            if (blend) gl.blendFunc(gl.ONE, gl.ONE);
            else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            gl.bindVertexArray(this.lineVAO);
            gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, maxCount * 2, n);
            gl.bindVertexArray(null);
        }

        dispose() {
            const gl = this.gl;
            gl.deleteProgram(this.lineProg);
            gl.deleteProgram(this.fadeProg);
            gl.deleteBuffer(this.fadeBuf);
            gl.deleteBuffer(this.vertexBuf);
            gl.deleteBuffer(this.instanceBuf);
            gl.deleteVertexArray(this.fadeVAO);
            gl.deleteVertexArray(this.lineVAO);
            gl.deleteTexture(this.yccTex);
        }
    }

    // 2D fallback when WebGL2 is unavailable. Decimates gradient stops so
    // createLinearGradient stays fast even with ~200 color samples per line.
    class Canvas2DPhosphor {
        constructor(canvas) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.width = canvas.width;
            this.height = canvas.height;
        }
        fade(alpha) {
            this.ctx.globalCompositeOperation = 'source-over';
            this.ctx.fillStyle = `rgba(0,0,0,${alpha})`;
            this.ctx.fillRect(0, 0, this.width, this.height);
        }
        static css(ycc, o, brightness, saturation) {
            const y = ycc[o] * brightness * 255;
            const cb = ycc[o + 1] * saturation * 255 - 128;
            const cr = ycc[o + 2] * saturation * 255 - 128;
            const r = Math.min(255, Math.max(0, y + 45 * cr / 32)) | 0;
            const g = Math.min(255, Math.max(0, y - (11 * cb + 23 * cr) / 32)) | 0;
            const b = Math.min(255, Math.max(0, y + 113 * cb / 64)) | 0;
            return `rgb(${r},${g},${b})`;
        }
        drawLines(lines, lineWidth, blend, brightness, saturation) {
            const ctx = this.ctx;
            ctx.globalCompositeOperation = blend ? 'screen' : 'source-over';
            ctx.lineWidth = lineWidth;
            const MAX_STOPS = 32;
            for (let li = 0; li < lines.length; li++) {
                const line = lines[li];
                if (line.count < 2 || line.maxPhase <= 0) continue;
                const grd = ctx.createLinearGradient(line.x1, line.y, line.x2, line.y);
                const count = line.count;
                const stride = Math.max(1, Math.floor(count / MAX_STOPS));
                const invMax = 1.0 / line.maxPhase;
                for (let i = 0; i < count; i += stride) {
                    let t = line.phase[i] * invMax;
                    if (t < 0) t = 0; else if (t > 1) t = 1;
                    grd.addColorStop(t, Canvas2DPhosphor.css(line.ycc, i * 3, brightness, saturation));
                }
                grd.addColorStop(1, Canvas2DPhosphor.css(line.ycc, (count - 1) * 3, brightness, saturation));
                ctx.beginPath();
                ctx.moveTo(line.x1 + Math.random() * 2 - 1, line.y + Math.random() * 2 - 1);
                ctx.lineTo(line.x2 + Math.random() * 2 - 1, line.y + Math.random() * 2 - 1);
                ctx.strokeStyle = grd;
                ctx.stroke();
            }
        }
        dispose() {}
    }

    // ============================================
    // MAIN APPLICATION
    // ============================================
    const sourceCanvas = document.getElementById('source');
    const encodedCanvas = document.getElementById('encoded');
    const decodedCanvas = document.getElementById('decoded');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    // Encode on the GPU when WebGL2 is available. One instance is shared by
    // every encoder init() creates.
    let gpuEncoder = null;
    try {
        gpuEncoder = new WebGLEncoder();
    } catch (e) {
        console.warn('[SlowscanJam] GPU encoder unavailable, using CPU:', e.message);
    }

    // The GPU encoder uploads the canvas as a texture, so the canvas can stay
    // GPU-backed. The CPU fallback reads pixels back every frame, and
    // willReadFrequently keeps its backing store CPU-side for that.
    const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: !gpuEncoder });
    const encodedCtx = encodedCanvas.getContext('2d');

    let video = null;
    let encoder = null;
    let decoder = null;
    let audioCtx = null;
    let audioOutputNode = null;
    let isRunning = false;

    // Encoder output rate. The decoder and the playback context must run at
    // the same rate, or line timing breaks and playback drifts.
    const SAMPLE_RATE = 96000;

    // Power-of-two ring buffer for audio playback queue. Replaces JS arrays
    // that were grown via push() and periodically .slice()'d (O(n) churn).
    const AUDIO_QUEUE_SIZE = 1 << 18; // 262144, ~2.7s at 96k
    const AUDIO_QUEUE_MASK = AUDIO_QUEUE_SIZE - 1;
    const audioQueueL = new Float32Array(AUDIO_QUEUE_SIZE);
    const audioQueueR = new Float32Array(AUDIO_QUEUE_SIZE);
    let audioWrite = 0;
    let audioRead = 0;

    function enqueueAudio(left, right) {
        const n = left.length;
        let w = audioWrite;
        for (let i = 0; i < n; i++) {
            audioQueueL[w] = left[i];
            audioQueueR[w] = right[i];
            w = (w + 1) & AUDIO_QUEUE_MASK;
        }
        audioWrite = w;
        // If the producer laps the consumer, slide the read head forward
        // so we drop the oldest samples rather than corrupting ordering.
        const occupancy = (audioWrite - audioRead) & AUDIO_QUEUE_MASK;
        if (occupancy > AUDIO_QUEUE_SIZE - 4096) {
            audioRead = (audioWrite - (AUDIO_QUEUE_SIZE - 4096)) & AUDIO_QUEUE_MASK;
        }
    }

    function init() {
        const fps = parseFloat(document.getElementById('fps').value);
        const lines = parseInt(document.getElementById('lines').value);
        const pulseLength = 0.2 / 1000;

        const hTime = (1 / fps / lines) * 2;
        const widthSamples = hTime - (pulseLength * 4);

        const hFreq = 1.0 / hTime;
        const vFreq = fps;
        const overScan = widthSamples / hTime;
        const hOffset = (pulseLength * 1.45) / hTime;

        if (!audioCtx) {
            // The browser resamples to the output device's native rate.
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
        }

        encoder = new SlowscanEncoder({
            sampleRate: SAMPLE_RATE,
            fps: fps,
            lines: lines,
            pulseLength: pulseLength,
            gpu: gpuEncoder
        });

        if (decoder) decoder.destroy();

        decoder = new SlowscanDecoder({
            canvas: decodedCanvas,
            lineWidth: parseFloat(document.getElementById('lineWidth').value),
            brightness: parseFloat(document.getElementById('brightness').value),
            saturation: parseFloat(document.getElementById('saturation').value),
            blend: document.getElementById('blend').checked,
            audioCtx: audioCtx,
            sampleRate: SAMPLE_RATE,
            hFreq: hFreq,
            vFreq: vFreq,
            overScan: overScan,
            hOffset: hOffset,
            pulseLength: pulseLength
        });

        if (!audioOutputNode) {
            audioOutputNode = audioCtx.createScriptProcessor(2048, 0, 2);
            audioOutputNode.onaudioprocess = function(e) {
                const L = e.outputBuffer.getChannelData(0);
                const R = e.outputBuffer.getChannelData(1);
                const len = L.length;
                let r = audioRead;
                let avail = (audioWrite - r) & AUDIO_QUEUE_MASK;
                for (let i = 0; i < len; i++) {
                    if (avail > 0) {
                        L[i] = audioQueueL[r] * 0.5;
                        R[i] = audioQueueR[r] * 0.5;
                        r = (r + 1) & AUDIO_QUEUE_MASK;
                        avail--;
                    } else {
                        L[i] = 0;
                        R[i] = 0;
                    }
                }
                audioRead = r;
            };
            audioOutputNode.connect(audioCtx.destination);
        }
    }

    function visualizeEncoded(left, right) {
        const w = encodedCanvas.width;
        const h = encodedCanvas.height;
        const step = Math.max(1, Math.ceil(left.length / w));

        encodedCtx.fillStyle = '#000';
        encodedCtx.fillRect(0, 0, w, h);

        encodedCtx.beginPath();
        for (let x = 0, px = 0; x < left.length; x += step, px++) {
            const py = (left[x] + 0.5) * h * 0.5;
            if (px === 0) encodedCtx.moveTo(px, py);
            else encodedCtx.lineTo(px, py);
        }
        encodedCtx.strokeStyle = '#0f0';
        encodedCtx.lineWidth = 1;
        encodedCtx.stroke();

        encodedCtx.beginPath();
        for (let x = 0, px = 0; x < right.length; x += step, px++) {
            const py = (right[x] + 0.5) * h * 0.5 + h * 0.5;
            if (px === 0) encodedCtx.moveTo(px, py);
            else encodedCtx.lineTo(px, py);
        }
        encodedCtx.strokeStyle = '#f0f';
        encodedCtx.lineWidth = 1;
        encodedCtx.stroke();
    }

    // UI handlers
    document.getElementById('lines').addEventListener('input', function() {
        document.getElementById('linesVal').textContent = this.value;
        if (isRunning) init();
    });
    document.getElementById('fps').addEventListener('input', function() {
        document.getElementById('fpsVal').textContent = this.value;
        if (isRunning) init();
    });
    document.getElementById('lineWidth').addEventListener('input', function() {
        document.getElementById('lineWidthVal').textContent = this.value;
        if (decoder) decoder.lineWidth = parseFloat(this.value);
    });
    document.getElementById('brightness').addEventListener('input', function() {
        document.getElementById('brightnessVal').textContent = this.value;
        if (decoder) decoder.brightness = parseFloat(this.value);
    });
    document.getElementById('saturation').addEventListener('input', function() {
        document.getElementById('saturationVal').textContent = this.value;
        if (decoder) decoder.saturation = parseFloat(this.value);
    });
    document.getElementById('blend').addEventListener('change', function() {
        if (decoder) decoder.blend = this.checked;
    });

    async function startCamera() {
        try {
            video = document.createElement('video');
            video.width = sourceCanvas.width;
            video.height = sourceCanvas.height;
            video.autoplay = true;
            video.playsInline = true;
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 320, height: 150 }
            });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => resolve(video);
            });
        } catch (err) {
            console.error('Camera error:', err);
            statusEl.textContent = 'Camera access denied: ' + err.message;
            throw err;
        }
    }

    async function processFrame() {
        if (!isRunning || !video) {
            requestAnimationFrame(processFrame);
            return;
        }

        sourceCtx.drawImage(video, 0, 0, sourceCanvas.width, sourceCanvas.height);
        const enc = encoder;
        const signal = await enc.encodeCanvas(sourceCanvas, sourceCtx);

        // Skip the frame if init() replaced the encoder while the GPU worked.
        if (signal && enc === encoder) {
            const { left, right } = signal;

            // Feed audio through decoder in chunks. subarray() is a view (no copy).
            const bufferSize = 512;
            for (let i = 0; i < left.length; i += bufferSize) {
                const end = Math.min(i + bufferSize, left.length);
                decoder.process(left.subarray(i, end), right.subarray(i, end));
            }

            enqueueAudio(left, right);
            visualizeEncoded(left, right);
        }

        const fps = parseFloat(document.getElementById('fps').value);
        const frameInterval = 1000 / fps;
        setTimeout(() => requestAnimationFrame(processFrame), frameInterval);
    }

    startBtn.addEventListener('click', async function() {
        startBtn.style.display = 'none';
        statusEl.textContent = 'Initializing...';
        try {
            init();
            await startCamera();
            decoder.activate();
            isRunning = true;
            statusEl.textContent = `Running: Camera -> Encoder (${encoder.gpu ? 'GPU' : 'CPU'}) -> Decoder -> Display`;
            processFrame();
        } catch (err) {
            statusEl.textContent = 'Error: ' + err.message;
        }
    });
    </script>
</body>
</html>
